<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="stylesheet.css">
        <title>povo 180日計算ツール</title>
    </head>
    <body>
        <header>
            <h1 class="title">povo Tool</h1>
            <ul>
                <li><a href="index.html">povo Calc</a></li>
            </ul>
        </header>

        <main>
            <h2>180日計算ツール</h2>
            
            <div class="form-group">
                <p class="form-exp">最後のトッピング購入日を入力</p>
                <input type="date" id="calender" class="form-box" min="2022-01-01">
            </div>

            <div class="button-area">
                <input type="button" value="計算" id="startButton" onclick="date_cal()">
            </div>

            <div id="outputMessage">
                <p id="result-text">日付を選択して計算ボタンを押してください</p>
            </div>
        </main>

        <footer>
            <p class="copyright">©2025 BobGuro</p>
        </footer>

        <script>
            function date_cal() { 
                const calenderInput = document.getElementById('calender');
                const resultElement = document.getElementById('result-text');
                const selectedDateStr = calenderInput.value;

                if(!selectedDateStr){
                    resultElement.textContent = '日付を選択してください';
                    return;
                }
                
                const baseDate = new Date(selectedDateStr);
                baseDate.setDate(baseDate.getDate() + 180);

                const year = baseDate.getFullYear();
                const month = baseDate.getMonth() + 1;
                const date = baseDate.getDate();
                
                const formattedDate = `${year}年${month}月${date}日`;
                resultElement.innerHTML = `180日後は<br><strong>${formattedDate}</strong><br>です。`;
            }   
        </script>
    </body>
</html>
